<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #2b2f36; overflow: hidden;
               height: 100%; user-select: none; }
  /* 舞台：JS 按窗口等比缩放（letterbox），逻辑坐标 = 画布像素。
     基础三层：#bg 底层 2D 画布（背景色 + 正图层 PNG）→ #gl WebGL（正图层
     spine）→ #overlay 顶层 DOM（正图层 SVG/HTML）。
     顶层世界（负数图层，压住一切）：#bgTop（负 PNG）→ #glTop（负 spine）
     → #overlayTop（负 SVG/HTML），叠在基础三层之上。 */
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #bg, #bgTop { position: absolute; left: 0; top: 0; }
  #gl, #glTop { display: block; position: absolute; left: 0; top: 0; }
  /* 覆盖层：逻辑坐标由 JS transform:scale 缩放；行序(layer)即 DOM 序，后 append 在上 */
  #overlay, #overlayTop { position: absolute; left: 0; top: 0; overflow: hidden;
             transform-origin: 0 0; }
  .ov { position: absolute; transform-origin: center center; cursor: move; }
  .ov img { pointer-events: none; user-select: none; -webkit-user-drag: none; display: block; }
  .ov svg { display: block; overflow: visible; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="bg" width="1280" height="720"></canvas>
    <canvas id="gl" width="1280" height="720"></canvas>
    <div id="overlay"></div>
    <canvas id="bgTop" width="1280" height="720"></canvas>
    <canvas id="glTop" width="1280" height="720"></canvas>
    <div id="overlayTop"></div>
  </div>
  <script src="{vendor}/spine-core.js"></script>
  <script src="{vendor}/spine-webgl.js"></script>
  {bridge_js}
  <script src="html/stage.js"></script>
</body>
</html>
